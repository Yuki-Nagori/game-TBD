name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            pkg-config
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        # 豁免 Bevy 插件/main/字体（遵循 PLAN 2.9：插件覆盖延期至 Phase 3）
        # 注：tarpaulin 0.37 的 .config/tarpaulin.toml 在 Windows 有 bug（把 exclude-files 当 manifest path），故用 CLI 参数
        run: |
          cd engine
          cargo tarpaulin --features dev-tools --exclude-files 'src/main.rs' 'src/font_center.rs' 'src/plugins/*' --out Xml --out Html --fail-under 60
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./engine/cobertura.xml
          fail_ci_if_error: false
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./engine/tarpaulin-report.html
